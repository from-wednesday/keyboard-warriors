<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyboard Warriors cover page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/keyboard-warriors/styles/documentation_design-system.css">
<style>
  /* ══════════════════════════════════════════════════════════════
     Page-specific components for cover.html.
     Everything shared with the rest of the site (tokens, chrome,
     callouts, lists) lives in ../styles/documentation_design-system.css —
     this block only covers the hero image and its caption line,
     unique to this page.
     ══════════════════════════════════════════════════════════════ */

  .hero-media img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
    border: 0px solid var(--rule);
  }

  .cover-caption {
    text-align: center;
    max-width: 640px;
    margin: 0 auto;
  }
</style>
</head>
<body>
<div class="page">

    <p class="eyebrow">Keyboard Warriors · Welcome</p>
    <h1 class="h1-alt"><em>Quickly master your software so you can focus on the actual work.</em></h1>


  <!-- ══ HERO IMAGE ══════════════════════════════════════════════ -->
  <section>
    <div class="hero-media">
      <img src="/keyboard-warriors/images/keyboard-3d.png" alt="A 3D rendered keyboard, illustrating keyboard shortcut mastery.">
    </div>
    <p class="cover-caption">Public app free for individuals. Enquire about an institution license built for your curriculum.</p>
  </section>

</div><!-- /.page -->
</body>
</html>
