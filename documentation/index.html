<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>documentation for Keyboard Warriors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --page-bg-light:#f4f1ea;
    --page-bg-dark:#1b211c;
    --ink-light:#24352b;
    --ink-dark:#dce8e0;
    --dur:420ms;
    --press-dur:90ms;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--page-bg);
    font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    overflow:hidden;
  }
  body[data-theme="light"]{ --page-bg:var(--page-bg-light); }
  body[data-theme="dark"]{ --page-bg:var(--page-bg-dark); }
  .shell{
    position:relative;
    height:100vh;
    height:100dvh;
    width:100vw;
    overflow:hidden;
  }
  .stack-title{
    position:absolute;
    top:18px;
    left:24px;
    margin:0;
    font-size:.78rem;
    font-weight:600;
    letter-spacing:.14em;
    opacity:.72;
    z-index:20000;
    pointer-events:none;
  }
  .shell.is-narrow .stack-title{
    top:calc(14px + env(safe-area-inset-top, 0px));
    left:0;
    width:100%;
    padding:0 16px;
    text-align:center;
  }
  .tab{
    position:absolute;
    top:0; left:0;
    height:var(--row-h);
    transition:
      transform var(--tab-dur,var(--dur)) var(--ease) var(--tab-delay,0ms),
      width var(--tab-dur,var(--dur)) var(--ease) var(--tab-delay,0ms),
      height var(--tab-dur,var(--dur)) var(--ease) var(--tab-delay,0ms);
    will-change:transform;
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    pointer-events:none;
  }
  .tab svg{
    display:block;
    width:100%;
    height:100%;
    overflow:visible;
    pointer-events:none;
  }
  .tab path{
    transition:fill var(--dur) var(--ease), stroke var(--dur) var(--ease);
    pointer-events:visiblePainted;
    cursor:pointer;
  }
  .tab h2 .tab-dev-tag{
    font-size:.78em;
    opacity:.72;
    margin-right:2px;
  }
  .tab h2{
    position:absolute;
    top:0; left:0; right:0;
    min-height:var(--flap-h);
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6px 10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:.86rem;
    font-weight:500;
    letter-spacing:.01em;
    white-space:normal;
    line-height:1.2;
    overflow:visible;
    pointer-events:none;
    opacity:.75;
    transition:color var(--dur) var(--ease);
  }
  .frameHost{
    position:absolute;
    left:0;
    overflow-y:auto;
    overflow-x:hidden;
    background:transparent;
    opacity:0;
    pointer-events:none;
    transition:opacity 140ms ease;
    -webkit-overflow-scrolling:touch;
  }
  .frameHost.is-visible{
    opacity:1;
    pointer-events:auto;
  }
  .frameHost::-webkit-scrollbar{ width:9px; }
  .frameHost::-webkit-scrollbar-thumb{ background:rgba(120,120,120,.35); border-radius:6px; }
  iframe{
    width:100%;
    border:0;
    display:block;
    background:transparent;
    overflow:hidden; /* the iframe must never own its own scroll state —
                         .frameHost is the single source of truth for
                         scrolling, this just closes the gap where a
                         subpixel mismatch could give the iframe its
                         own native scrollbar alongside frameHost's */
  }
</style>
</head>
<body>
<div class="shell" id="shell">
  <h1 class="stack-title" id="stackTitle"></h1>
  <div id="tabLayer"></div>
</div>
<script>
(function(){
  const sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y});
  const add=(a,b)=>({x:a.x+b.x,y:a.y+b.y});
  const scale=(a,s)=>({x:a.x*s,y:a.y*s});
  const len=(a)=>Math.hypot(a.x,a.y);
  const normalize=(a)=>{ const l=len(a)||1; return {x:a.x/l,y:a.y/l}; };

  function cfgNumber(section,key,fallback){
    const v=manifest && manifest[section] ? manifest[section][key] : undefined;
    return Number.isFinite(Number(v)) ? Number(v) : fallback;
  }
  function cfgBool(section,key,fallback){
    const v=manifest && manifest[section] ? manifest[section][key] : undefined;
    return typeof v==='boolean' ? v : fallback;
  }
  function nestedCfg(section,group,key,fallback){
    const obj=manifest && manifest[section] && manifest[section][group] ? manifest[section][group] : null;
    return obj && obj[key] !== undefined ? obj[key] : fallback;
  }
  function animNumber(key,fallback){ return cfgNumber('animation',key,fallback); }
  function responsiveNumber(key,fallback){ return cfgNumber('responsive',key,fallback); }
  function responsiveBool(key,fallback){ return cfgBool('responsive',key,fallback); }
  function narrowSetting(key,fallback){ return nestedCfg('responsive','narrowMode',key,fallback); }
  function animationEasing(){ return (manifest.animation && manifest.animation.easing) || 'cubic-bezier(.22,1,.36,1)'; }
  function applyManifestRuntimeSettings(){
    document.documentElement.style.setProperty('--ease', animationEasing());
    document.documentElement.style.setProperty('--dur', animNumber('transitionMs',560)+'ms');
    document.documentElement.style.setProperty('--press-dur', animNumber('pressMs',90)+'ms');
  }

  function makeCubicBezierEasing(x1,y1,x2,y2){
    // Mirrors how CSS evaluates a cubic-bezier() timing function: solves
    // for the curve parameter t at a given time fraction x using Newton-
    // Raphson, then reads off the eased y value at that t. This lets a
    // JS-driven animation (the anchor scroll) move on exactly the same
    // curve as the CSS-driven tab transitions, defined once in the
    // manifest's animation.easing value.
    function bezierComponent(t,a1,a2){
      const c=3*a1, b=3*(a2-a1)-c, a=1-c-b;
      return ((a*t+b)*t+c)*t;
    }
    function bezierComponentDerivative(t,a1,a2){
      const c=3*a1, b=3*(a2-a1)-c, a=1-c-b;
      return (3*a*t+2*b)*t+c;
    }
    function solveTForX(x){
      let t=x;
      for(let i=0;i<8;i++){
        const currentX=bezierComponent(t,x1,x2)-x;
        const currentSlope=bezierComponentDerivative(t,x1,x2);
        if(Math.abs(currentSlope)<1e-6) break;
        t-=currentX/currentSlope;
      }
      return Math.min(1,Math.max(0,t));
    }
    return function(x){
      if(x<=0) return 0;
      if(x>=1) return 1;
      return bezierComponent(solveTForX(x),y1,y2);
    };
  }
  function anchorEasingFunction(){
    const key=animationEasing();
    if(cachedAnchorEasing && cachedAnchorEasingKey===key) return cachedAnchorEasing;
    const match=/cubic-bezier\(\s*([\d.]+)\s*,\s*(-?[\d.]+)\s*,\s*([\d.]+)\s*,\s*(-?[\d.]+)\s*\)/.exec(key);
    cachedAnchorEasing=match
      ? makeCubicBezierEasing(parseFloat(match[1]),parseFloat(match[2]),parseFloat(match[3]),parseFloat(match[4]))
      : (t)=>t; // fallback if the manifest's easing string cannot be parsed: linear, so scrolling still works
    cachedAnchorEasingKey=key;
    return cachedAnchorEasing;
  }

  function roundedPolygonPath(points, radius){
    const d=[]; const n=points.length;
    const radii = Array.isArray(radius) ? radius : points.map(()=>radius);
    for(let i=0;i<n;i++){
      const prev=points[(i-1+n)%n], curr=points[i], next=points[(i+1)%n];
      const toPrev=sub(prev,curr), toNext=sub(next,curr);
      const r=Math.min(radii[i], len(toPrev)/2, len(toNext)/2);
      const p1=add(curr,scale(normalize(toPrev),r));
      const p2=add(curr,scale(normalize(toNext),r));
      d.push(i===0?`M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)}`:`L ${p1.x.toFixed(2)} ${p1.y.toFixed(2)}`);
      d.push(`Q ${curr.x.toFixed(2)} ${curr.y.toFixed(2)} ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`);
    }
    d.push('Z');
    return d.join(' ');
  }
  function folderPath(w,h,flapX,flapW,flapH,leanPx,cornerR,concaveR){
    const fx0=flapX, fx1=flapX+flapW;
    const pts=[
      {x:0,           y:h},
      {x:0,           y:flapH},
      {x:fx0,         y:flapH},
      {x:fx0+leanPx,  y:0},
      {x:fx1-leanPx,  y:0},
      {x:fx1,         y:flapH},
      {x:w,           y:flapH},
      {x:w,           y:h},
    ];
    const radii=[cornerR,cornerR,concaveR,cornerR,cornerR,concaveR,cornerR,cornerR];
    return roundedPolygonPath(pts,radii);
  }
  function darken(hex, amt){
    const n = hex.replace('#','');
    const r = parseInt(n.substring(0,2),16), g = parseInt(n.substring(2,4),16), b = parseInt(n.substring(4,6),16);
    const f = (c)=>Math.max(0,Math.round(c*(1-amt)));
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  }
  function titleColour(hex){
    // Dark-mode tab fills are already mid-to-dark greys, so darkening
    // them the same way as light mode crushes the title toward black.
    // Use a fixed mid grey instead.
    return theme==='dark' ? '#9099a0' : darken(hex,0.80);
  }
  // Accepts either a "#rrggbb" hex string or a browser-computed
  // "rgb(r, g, b)" string and returns the three channel values.
  function parseColourToRgb(colour){
    if(colour.charAt(0)==='#'){
      const n=colour.replace('#','');
      return {
        r:parseInt(n.substring(0,2),16),
        g:parseInt(n.substring(2,4),16),
        b:parseInt(n.substring(4,6),16)
      };
    }
    const match=/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/.exec(colour);
    if(match) return {r:+match[1],g:+match[2],b:+match[3]};
    return {r:0,g:0,b:0};
  }
  // Standard relative-luminance estimate (0 = black, 1 = white),
  // weighted toward green since human eyes are most sensitive to it.
  function relativeLuminance(colour){
    const {r,g,b}=parseColourToRgb(colour);
    return (0.2126*r + 0.7152*g + 0.0722*b)/255;
  }
  // Picks a readable text colour for whatever colour is actually
  // painted behind it. Most tabs paint their own folder colour behind
  // the text, and those stay light/mid-toned even in dark mode, so
  // darkening them keeps working exactly as it always has. Only a
  // hidden tab with no folder colour of its own (currently just the
  // cover tab) ever falls through to the page's own dark background,
  // which needs light text instead.
  function readableTextColour(bgColour){
    return relativeLuminance(bgColour) < 0.5 ? '#e2e5ea' : darken(bgColour,0.80);
  }
  let manifest=null;
  let activeIndex=0;
  let prevIndex=0;
  let pressedIndex=null;
  let transitioningFrom=null;
  let transitionTimer=null;
  let isLoadingPhase=true;
  let framesLoadedCount=0;
  let loadingSafetyTimer=null;
  let anchorScrollRafId=null;
  let cachedAnchorEasing=null;
  let cachedAnchorEasingKey=null;
  const theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light';
  document.body.dataset.theme=theme;
  const shell=document.getElementById('shell');
  const tabLayer=document.getElementById('tabLayer');
  const stackTitle=document.getElementById('stackTitle');

  function resolveBg(){
    return manifest.colors[theme] || manifest.colors.light;
  }
  function resolveTabBg(tab){
    if(tab && tab.colors){
      return tab.colors[theme] || tab.colors.light || tab.colors.dark || resolveBg();
    }
    return resolveBg();
  }
  function resolvePageBg(){
    return getComputedStyle(document.body).backgroundColor;
  }
  function useVisualViewport(){
    return responsiveBool('useVisualViewport', responsiveBool('useDynamicViewport', true));
  }
  function currentViewportHeight(){
    if(useVisualViewport() && window.visualViewport && window.visualViewport.height){
      return Math.round(window.visualViewport.height);
    }
    return shell.clientHeight;
  }
  function isNarrowLayout(vw,L){
    if(narrowSetting('enabled',true) === false) return false;
    const baseMargin=32;
    const edgeClearance=L.cornerRadiusPx+8;
    const normalW=vw-baseMargin*2;
    const usableW=normalW-L.flapWidthPx-edgeClearance*2;
    const normalSlots=Math.max(1,Math.floor(usableW/L.flapStepPx)+1);
    return normalSlots<2;
  }
  function effectivePeekStep(vh,n,narrow,L){
    let peek=L.peekStepPx;
    const compactAt=responsiveNumber('compactAtViewportHeightPx',720);
    if(narrow || vh<compactAt){
      const maxShare=responsiveNumber('tabStackMaxViewportShare',0.34);
      const minPeek=responsiveNumber('minPeekStepPx',18);
      const maxStackPx=Math.max(L.flapHeightPx*1.8, vh*maxShare);
      const maxPeek=Math.floor(maxStackPx/Math.max(1,n-1));
      peek=Math.max(minPeek,Math.min(L.peekStepPx,maxPeek));
    }
    return peek;
  }
  function computeLayout(){
    const L=manifest.layout;
    const n=manifest.tabs.length;
    const vw=shell.clientWidth, vh=currentViewportHeight();
    const narrow=isNarrowLayout(vw,L);
    const titleRow=narrow && narrowSetting('titleRow',true);
    const fullWidthTabs=narrow && narrowSetting('fullWidthTabs',true);
    const alternateFlaps=narrow && narrowSetting('alternateFlaps',true);
    const firstFlapSide=narrowSetting('firstFlapSide','right');
    shell.classList.toggle('is-narrow', titleRow);
    const baseMargin=32;
    const titleOffset=titleRow ? 56 : 18;
    const headerCount=manifest.tabs.slice(0,activeIndex).filter(function(t){return !t.hidden;}).length;
    const footerCount=manifest.tabs.slice(activeIndex+1).filter(function(t){return !t.hidden;}).length;
    const peekStepPx = effectivePeekStep(vh,n,narrow,L);
    const headerSpan = headerCount*peekStepPx;
    const openTop = titleOffset + headerSpan;
    const bottomMarginPx = (L.flapHeightPx - peekStepPx) + 12;
    const footerSpan = footerCount*peekStepPx;
    const openBottomSeam = (vh - bottomMarginPx) - footerSpan;
    const frameHostBottom = openBottomSeam + L.flapHeightPx + 6;
    const BASELINE_H = vh;
    const flapCascadeX=(i,containerW)=>{
      const edgeClearance=L.cornerRadiusPx+8;
      if(alternateFlaps){
        const evenRight = firstFlapSide !== 'left';
        const rightSide = (i%2===0) ? evenRight : !evenRight;
        return rightSide ? Math.max(edgeClearance, containerW-edgeClearance-L.flapWidthPx) : edgeClearance;
      }
      const usableW=containerW-L.flapWidthPx-edgeClearance*2;
      const slots=Math.max(1,Math.floor(usableW/L.flapStepPx)+1);
      const slot=(i+1)%slots;
      return edgeClearance+slot*L.flapStepPx;
    };
    const visibleBeforeActive = manifest.tabs
      .map((t,idx)=>idx)
      .filter(idx=>idx<activeIndex && !manifest.tabs[idx].hidden);
    const visibleAfterActive = manifest.tabs
      .map((t,idx)=>idx)
      .filter(idx=>idx>activeIndex && !manifest.tabs[idx].hidden);
    const offscreenTopY = -(BASELINE_H+400);
    const layout=manifest.tabs.map((tab,i)=>{
      const stepsFromFront=(n-1)-i;
      const margin=fullWidthTabs ? 0 : baseMargin+stepsFromFront;
      const width=vw-margin*2;
      const x=margin;
      const zIndex=i;
      if(i===activeIndex){
        if(tab.hidden){
          // The hidden "cover" tab has no visible flap, so it doesn't
          // need the title-offset + flap space every other tab reserves.
          // It fills the entire browser window instead, top to bottom.
          return {tab,i,isOpen:true,x,y:0,width,height:BASELINE_H,frameHostH:BASELINE_H,zIndex,narrow};
        }
        return {tab,i,isOpen:true,x,y:openTop,width,height:BASELINE_H,frameHostH:frameHostBottom-openTop,zIndex,narrow};
      }
      let y;
      if(tab.hidden){
        y=offscreenTopY;
      }else if(i<activeIndex){
        const k=visibleBeforeActive.length-visibleBeforeActive.indexOf(i);
        y=openTop-k*peekStepPx;
      }else{
        const j=visibleAfterActive.indexOf(i);
        y=openBottomSeam+j*peekStepPx;
      }
      return {tab,i,isOpen:false,x,y,width,height:BASELINE_H,zIndex,narrow};
    });
    return {layout,flapCascadeX,narrow};
  }

  // ── Loading skeleton layout ─────────────────────────────────────
  // All tabs sit closed, cascading gently down from the title, none
  // open yet. x/width per index match computeLayout()'s formula
  // exactly, so the reveal only ever has to animate y — the same
  // kind of move already used when switching between tabs.
  function computeLoadingLayout(){
    const L=manifest.layout;
    const n=manifest.tabs.length;
    const vw=shell.clientWidth, vh=currentViewportHeight();
    const narrow=isNarrowLayout(vw,L);
    const titleRow=narrow && narrowSetting('titleRow',true);
    const fullWidthTabs=narrow && narrowSetting('fullWidthTabs',true);
    const alternateFlaps=narrow && narrowSetting('alternateFlaps',true);
    const firstFlapSide=narrowSetting('firstFlapSide','right');
    shell.classList.toggle('is-narrow', titleRow);
    const baseMargin=32;
    const titleOffset=titleRow ? 56 : 18;
    const peekStepPx=effectivePeekStep(vh,n,narrow,L);
    const BASELINE_H=vh;
    const flapCascadeX=(i,containerW)=>{
      const edgeClearance=L.cornerRadiusPx+8;
      if(alternateFlaps){
        const evenRight = firstFlapSide !== 'left';
        const rightSide = (i%2===0) ? evenRight : !evenRight;
        return rightSide ? Math.max(edgeClearance, containerW-edgeClearance-L.flapWidthPx) : edgeClearance;
      }
      const usableW=containerW-L.flapWidthPx-edgeClearance*2;
      const slots=Math.max(1,Math.floor(usableW/L.flapStepPx)+1);
      const slot=(i+1)%slots;
      return edgeClearance+slot*L.flapStepPx;
    };
    const offscreenTopY = -(BASELINE_H+400);
    let visibleLoadingOrder=0;
    const layout=manifest.tabs.map((tab,i)=>{
      const stepsFromFront=(n-1)-i;
      const margin=fullWidthTabs ? 0 : baseMargin+stepsFromFront;
      const width=vw-margin*2;
      const x=margin;
      let y;
      if(tab.hidden){
        y=offscreenTopY;
      }else{
        y=titleOffset+visibleLoadingOrder*peekStepPx;
        visibleLoadingOrder++;
      }
      const zIndex=i;
      return {tab,i,isOpen:false,x,y,width,height:BASELINE_H,zIndex,narrow};
    });
    return {layout,flapCascadeX,narrow};
  }

  function paintLoading(opts={}){
    const L=manifest.layout;
    const {layout,flapCascadeX}=computeLoadingLayout();
    const instant=opts.instant===true;
    const transitionMs=animNumber('transitionMs',560);
    stackTitle.textContent=manifest.title||'';
    const FirstVisibleTabIndex=manifest.tabs.findIndex(t=>!t.hidden);
    const refColour=titleColour(resolveTabBg(manifest.tabs[FirstVisibleTabIndex]));
    document.body.style.color=refColour;
    stackTitle.style.color=refColour;
    layout.forEach(({tab,i,x,y,width,height,zIndex})=>{
      const {el,svg,path,h2,frameHost}=tabEls[i];
      el.style.setProperty('--tab-delay','0ms');
      el.style.setProperty('--tab-dur',(instant?0:transitionMs)+'ms');
      el.style.setProperty('--row-h',height+'px');
      el.style.setProperty('--flap-h',L.flapHeightPx+'px');
      el.style.width=width+'px';
      el.style.zIndex=zIndex;
      el.style.transform=`translate(${x}px, ${y}px) translateZ(0)`;
      el.classList.remove('is-active');
      const flapX=flapCascadeX(i,width);
      const leanPx=L.flapHeightPx*Math.tan(L.flapAngleDeg*Math.PI/180);
      const d=folderPath(width,height,flapX,L.flapWidthPx,L.flapHeightPx,leanPx,L.cornerRadiusPx,L.cornerRadiusPx);
      const tabBg=resolveTabBg(tab);
      const pageBg=resolvePageBg();
      const textColour=darken(tabBg,0.80);
      path.setAttribute('d',d);
      if(tab.hidden){
        path.setAttribute('fill','none');
        path.setAttribute('stroke','none');
        path.style.pointerEvents='none';
        svg.style.filter='none';
        h2.style.visibility='hidden';
      }else{
        h2.style.color=textColour;
        path.setAttribute('fill',tabBg);
        path.setAttribute('stroke',pageBg);
        path.setAttribute('stroke-width','1.6');
        path.setAttribute('stroke-linejoin','round');
        path.style.pointerEvents='';
        svg.style.filter=i===FirstVisibleTabIndex?'drop-shadow(1px -1px 2px rgba(0,0,0,.055))':'drop-shadow(1px -2px 4px rgba(0,0,0,.10))';
        h2.style.visibility='visible';
      }
      h2.style.left=flapX+'px';
      h2.style.width=L.flapWidthPx+'px';
      h2.style.right='auto';
      frameHost.style.top=L.flapHeightPx+'px';
      frameHost.style.width='100%';
      frameHost.style.height=Math.max(0,height-L.flapHeightPx)+'px';
      frameHost.style.borderRadius=L.cornerRadiusPx+'px';
      frameHost.classList.remove('is-visible');
    });
    lastLayout=layout.map(({tab,i,x,y,width,zIndex})=>({i,x,y,width,flapX:flapCascadeX(i,width),zIndex}));
  }

  let tabEls=[];
  let lastLayout=[];
  function shouldShowPane(i){
    return i===activeIndex || i===transitioningFrom;
  }
  function startPress(i,e,path){
    if(!manifest || isLoadingPhase || i===activeIndex) return;
    pressedIndex=i;
    try{ path.setPointerCapture(e.pointerId); }catch(err){}
    paint({mode:'press'});
  }
  function finishPress(i,activate){
    if(pressedIndex!==i) return;
    pressedIndex=null;
    if(activate && i!==activeIndex){
      setActive(i);
    }else{
      paint();
    }
  }
  function renderTabLabel(h2,label){
    var marker='</> ';
    if(label.indexOf(marker)===0){
      var rest=label.slice(marker.length);
      var tag=document.createElement('small');
      tag.className='tab-dev-tag';
      tag.textContent='</>';
      h2.appendChild(tag);
      h2.appendChild(document.createTextNode(' '+rest));
    }else{
      h2.textContent=label;
    }
  }
  function buildTabEls(){
    tabLayer.innerHTML='';
    tabEls=manifest.tabs.map((tab,i)=>{
      const el=document.createElement('div');
      el.className='tab';
      el.dataset.index=i;
      el.dataset.objectId=tab.objectId || (i+1);
      const ns='http://www.w3.org/2000/svg';
      const svg=document.createElementNS(ns,'svg');
      const path=document.createElementNS(ns,'path');
      path.addEventListener('pointerdown',(e)=>{
        e.preventDefault();
        e.stopPropagation();
        startPress(i,e,path);
      });
      path.addEventListener('pointerup',(e)=>{
        e.preventDefault();
        e.stopPropagation();
        finishPress(i,true);
      });
      path.addEventListener('pointercancel',(e)=>{
        e.stopPropagation();
        finishPress(i,false);
      });
      path.addEventListener('click',(e)=>{
        e.preventDefault();
        e.stopPropagation();
      });
      path.addEventListener('mouseenter',()=>{
        shell.style.cursor=i!==activeIndex?'pointer':'default';
      });
      path.addEventListener('mouseleave',()=>{
        shell.style.cursor='default';
      });
      svg.appendChild(path);
      el.appendChild(svg);
      const h2=document.createElement('h2');
      renderTabLabel(h2,tab.label);
      el.appendChild(h2);
      const frameHost=document.createElement('div');
      frameHost.className='frameHost';
      const iframe=document.createElement('iframe');
      iframe.title=tab.label+' content';
      frameHost.appendChild(iframe);
      el.appendChild(frameHost);
      tabLayer.appendChild(el);
      return {el,svg,path,h2,frameHost,iframe,ro:null,loaded:false,lastPaneH:null};
    });
  }
  function cascadeDelayFor(i,mode){
    if(mode==='press') return 0;
    const source=transitioningFrom??activeIndex;
    if(i===source) return 0;
    return Math.min(Math.abs(i-source),8)*animNumber('cascadeStepMs',35);
  }
  function paneHeightFor(i,frameHostH,L){
    const flapOffset=(manifest.tabs[i] && manifest.tabs[i].hidden) ? 0 : L.flapHeightPx;
    if(i===activeIndex && frameHostH){
      const h=frameHostH-flapOffset;
      tabEls[i].lastPaneH=h;
      return h;
    }
    return tabEls[i].lastPaneH || Math.max(0,currentViewportHeight()-flapOffset);
  }
  function pressOffsetForTab(i){
    if(pressedIndex===null || pressedIndex===activeIndex) return 0;
    const pressOffsetPx=animNumber('pressOffsetPx',4);
    if(pressedIndex<activeIndex){
      return (i>pressedIndex && i<=activeIndex) ? -pressOffsetPx : 0;
    }
    return i===pressedIndex ? pressOffsetPx : 0;
  }
  function paint(opts={}){
    const mode=opts.mode||'normal';
    const L=manifest.layout;
    const {layout,flapCascadeX}=computeLayout();
    const transitionMs=animNumber('transitionMs',560);
    const pressMs=animNumber('pressMs',90);
    let maxDelay=0;
    stackTitle.textContent=manifest.title||'';
    const FirstVisibleTabIndex=manifest.tabs.findIndex(t=>!t.hidden);
    layout.forEach(({tab,i,isOpen,x,y,width,height,frameHostH,zIndex})=>{
      const {el,svg,path,h2,frameHost}=tabEls[i];
      const pressDy=pressOffsetForTab(i);
      const delay=cascadeDelayFor(i,mode);
      maxDelay=Math.max(maxDelay,delay);
      el.style.setProperty('--tab-delay',delay+'ms');
      el.style.setProperty('--tab-dur',(mode==='press' && (i===pressedIndex || pressDy!==0) ? pressMs : transitionMs)+'ms');
      el.style.setProperty('--row-h',height+'px');
      el.style.setProperty('--flap-h',L.flapHeightPx+'px');
      el.style.width=width+'px';
      el.style.zIndex=zIndex;
      el.style.transform=`translate(${x}px, ${y+pressDy}px) translateZ(0)`;
      el.classList.toggle('is-active',isOpen);
      const flapX=flapCascadeX(i,width);
      const leanPx=L.flapHeightPx*Math.tan(L.flapAngleDeg*Math.PI/180);
      const d=folderPath(width,height,flapX,L.flapWidthPx,L.flapHeightPx,leanPx,L.cornerRadiusPx,L.cornerRadiusPx);
      const tabBg=resolveTabBg(tab);
      const pageBg=resolvePageBg();
      const textColour=darken(tabBg,0.80);
      document.body.style.color=titleColour(resolveTabBg(manifest.tabs[activeIndex]));
      stackTitle.style.color=document.body.style.color;
      path.setAttribute('d',d);
      if(tab.hidden){
        path.setAttribute('fill','none');
        path.setAttribute('stroke','none');
        path.style.pointerEvents='none';
        svg.style.filter='none';
        h2.style.visibility='hidden';
      }else{
        h2.style.color=textColour;
        path.setAttribute('fill',tabBg);
        path.setAttribute('stroke',pageBg);
        path.setAttribute('stroke-width','1.6');
        path.setAttribute('stroke-linejoin','round');
        path.style.pointerEvents='';
        svg.style.filter=i===FirstVisibleTabIndex?'drop-shadow(1px -1px 2px rgba(0,0,0,.055))':'drop-shadow(1px -2px 4px rgba(0,0,0,.10))';
        h2.style.visibility='visible';
      }
      h2.style.left=flapX+'px';
      h2.style.width=L.flapWidthPx+'px';
      h2.style.right='auto';
      frameHost.style.top=(tab.hidden?0:L.flapHeightPx)+'px';
      frameHost.style.width='100%';
      frameHost.style.height=paneHeightFor(i,frameHostH,L)+'px';
      frameHost.style.borderRadius=tab.hidden?'0px':L.cornerRadiusPx+'px';
      frameHost.classList.toggle('is-visible',shouldShowPane(i));
      if(shouldShowPane(i)) loadFrame(i);
    });
    lastLayout=layout.map(({tab,i,x,y,width,zIndex})=>({i,x,y,width,zIndex,flapX:flapCascadeX(i,width)}));
    return maxDelay+transitionMs;
  }
  function primeParallaxStart(previousLayout){
    const previousByIndex=new Map(previousLayout.map(t=>[t.i,t]));
    const L=manifest.layout;
    const {layout}=computeLayout();
    const transitionMs=animNumber('transitionMs',560);
    const parallaxPx=animNumber('parallaxPx',18);
    layout.forEach(({i,x,y,width,height})=>{
      const item=tabEls[i];
      const old=previousByIndex.get(i);
      if(!item || !old) return;
      const dy=y-old.y;
      const travel=Math.abs(dy);
      const dir=dy===0?0:dy/Math.abs(dy);
      const depth=Math.min(1.8,1+travel/Math.max(1,L.peekStepPx)*0.08);
      const kick=dir===0?0:-dir*parallaxPx*depth;
      item.el.style.transition='none';
      item.el.style.setProperty('--row-h',height+'px');
      item.el.style.setProperty('--flap-h',L.flapHeightPx+'px');
      item.el.style.setProperty('--tab-dur',transitionMs+'ms');
      item.el.style.setProperty('--tab-delay','0ms');
      item.el.style.width=width+'px';
      item.el.style.transform=`translate(${x}px, ${old.y+kick}px) translateZ(0)`;
    });
    tabLayer.offsetHeight;
    tabEls.forEach(item=>{ item.el.style.transition=''; });
  }
  function setActive(i){
    if(i===activeIndex) return;
    if(transitionTimer) clearTimeout(transitionTimer);
    const previousLayout=lastLayout.map(t=>({...t}));
    prevIndex=activeIndex;
    transitioningFrom=activeIndex;
    activeIndex=i;
    primeParallaxStart(previousLayout);
    requestAnimationFrame(()=>{
      const totalMs=paint({mode:'switch'});
      transitionTimer=setTimeout(()=>{
        transitioningFrom=null;
        paint();
      },totalMs+80);
    });
  }

  // Matches a tab by its objectId, its label (case-insensitive), or a
  // plain numeric index, in that order. Shared by the startup ?tab= URL
  // lookup and by subpages asking to switch tabs, so both use identical
  // matching rules.
  function findTabIndex(tabs,identifier,fallbackIndex){
    if(identifier===null || identifier===undefined) return fallbackIndex;
    const list=tabs || [];
    const byId=list.findIndex(t=>String(t.objectId)===String(identifier));
    if(byId!==-1) return byId;
    const byLabel=list.findIndex(t=>(t.label||'').toLowerCase()===String(identifier).toLowerCase());
    if(byLabel!==-1) return byLabel;
    const asIndex=parseInt(identifier,10);
    if(Number.isFinite(asIndex) && asIndex>=0 && asIndex<list.length) return asIndex;
    return fallbackIndex;
  }

  // Called from a subpage (via window.parent.DocumentationTabController)
  // when a link should open a different tab in the stack.
  function switchToTab(identifier){
    if(!manifest) return;
    const index=findTabIndex(manifest.tabs,identifier,-1);
    if(index===-1) return;
    setActive(index);
  }

  // Called from a subpage when an in-page anchor is clicked. targetY is
  // the anchor target's offset within the currently active tab's own
  // scrollable frameHost. Animates frameHost.scrollTop to that offset
  // using the manifest's own easing curve, rather than letting the
  // browser's native anchor-jump behaviour fight the tab stack's
  // custom scroll ownership.
  function scrollActiveFrameTo(targetY){
    const item=tabEls[activeIndex];
    if(!item) return;
    const frameHost=item.frameHost;
    const startY=frameHost.scrollTop;
    const maxScrollY=Math.max(0,frameHost.scrollHeight-frameHost.clientHeight);
    const clampedTargetY=Math.min(Math.max(0,targetY),maxScrollY);
    const distance=clampedTargetY-startY;
    if(Math.abs(distance)<1){ frameHost.scrollTop=clampedTargetY; return; }
    const durationMs=animNumber('anchorScrollMs',480);
    const easing=anchorEasingFunction();
    const startTime=performance.now();
    if(anchorScrollRafId) cancelAnimationFrame(anchorScrollRafId);
    function step(now){
      const elapsed=now-startTime;
      const progress=Math.min(1,elapsed/durationMs);
      frameHost.scrollTop=startY+distance*easing(progress);
      if(progress<1){
        anchorScrollRafId=requestAnimationFrame(step);
      }else{
        anchorScrollRafId=null;
      }
    }
    anchorScrollRafId=requestAnimationFrame(step);
  }

  // ── Skeleton reveal ──────────────────────────────────────────────
  // Preload every tab's iframe while the skeleton row is showing.
  // Once every tab has finished loading (or the safety timer fires),
  // slide from the loading row into the "first tab open" layout
  // using the same parallax start used for ordinary tab switches.
  function beginPreload(){
    framesLoadedCount=0;
    loadingSafetyTimer=setTimeout(()=>{
      if(isLoadingPhase) completeLoadingPhase();
    },5000);
    manifest.tabs.forEach((tab,i)=>loadFrame(i));
  }
  function completeLoadingPhase(){
    if(!isLoadingPhase) return;
    isLoadingPhase=false;
    if(loadingSafetyTimer){ clearTimeout(loadingSafetyTimer); loadingSafetyTimer=null; }
    if(transitionTimer) clearTimeout(transitionTimer);
    const previousLayout=lastLayout.map(t=>({...t}));
    primeParallaxStart(previousLayout);
    requestAnimationFrame(()=>{
      const totalMs=paint({mode:'switch'});
      transitionTimer=setTimeout(()=>{
        transitioningFrom=null;
        paint();
      },totalMs+80);
    });
  }

  function applyFrameTextColour(i){
    try{
      const item=tabEls[i];
      const doc=item.iframe.contentWindow.document;
      const tab=manifest.tabs[i];
      // Hidden tabs (currently just "cover") paint no folder shape of
      // their own, so their real visible background is the page's own
      // background rather than a manifest colour.
      const actualBackground=tab.hidden ? resolvePageBg() : resolveTabBg(tab);
      const textColour=readableTextColour(actualBackground);
      doc.documentElement.style.color=textColour;
      if(doc.body) doc.body.style.color=textColour;
    }catch(e){ }
  }
  function measureFrameContent(i){
    const doc=tabEls[i].iframe.contentWindow.document;
    const body=doc.body;
    const html=doc.documentElement;
    return Math.ceil(Math.max(
      body?body.scrollHeight:0,
      body?body.offsetHeight:0,
      html?html.scrollHeight:0,
      html?html.offsetHeight:0
    ));
  }
  function resizeFrame(i){
    try{
      const item=tabEls[i];
      const contentHeight=measureFrameContent(i);
      item.iframe.style.height=contentHeight+'px';
      const hostHeight=item.frameHost.clientHeight;
      const needsScroll=contentHeight>hostHeight+1;
      item.frameHost.style.overflowY=needsScroll?'auto':'hidden';
      if(!needsScroll) item.frameHost.scrollTop=0;
      applyFrameTextColour(i);
    }catch(e){ }
  }
  function loadFrame(i){
    const item=tabEls[i];
    if(item.loaded) return;
    const tab=manifest.tabs[i];
    item.loaded=true;
    item.frameHost.scrollTop=0;
    item.frameHost.style.overflowY='hidden';
    item.iframe.style.height='0px';
    item.iframe.onload=()=>{
      resizeFrame(i);
      requestAnimationFrame(()=>{
        resizeFrame(i);
        requestAnimationFrame(()=>resizeFrame(i));
      });
      if(item.ro) item.ro.disconnect();
      item.ro=new ResizeObserver(()=>resizeFrame(i));
      try{
        item.ro.observe(item.iframe.contentWindow.document.body);
        item.ro.observe(item.iframe.contentWindow.document.documentElement);
      }catch(e){}
      framesLoadedCount++;
      if(isLoadingPhase && framesLoadedCount>=manifest.tabs.length){
        completeLoadingPhase();
      }
    };
    item.iframe.src=tab.url;
  }
  function tabAtPoint(px,py){
    const L=manifest.layout;
    const sorted=[...lastLayout].sort((a,b)=>b.zIndex-a.zIndex);
    for(const t of sorted){
      if(manifest.tabs[t.i] && manifest.tabs[t.i].hidden) continue;
      const lx=px-t.x, ly=py-t.y;
      if(lx<0||lx>t.width||ly<0) continue;
      if(ly<L.flapHeightPx){
        if(lx>=t.flapX && lx<=t.flapX+L.flapWidthPx) return t.i;
      }else{
        return t.i;
      }
    }
    return null;
  }
  shell.addEventListener('click',(e)=>{
    if(!manifest || isLoadingPhase) return;
    const rect=shell.getBoundingClientRect();
    const i=tabAtPoint(e.clientX-rect.left,e.clientY-rect.top);
    if(i!==null) setActive(i);
  });
  shell.addEventListener('mousemove',(e)=>{
    if(!manifest || isLoadingPhase) return;
    const rect=shell.getBoundingClientRect();
    const i=tabAtPoint(e.clientX-rect.left,e.clientY-rect.top);
    shell.style.cursor=(i!==null && i!==activeIndex)?'pointer':'default';
  });
  stackTitle.style.pointerEvents='auto';
  stackTitle.addEventListener('click',()=>{
    if(!manifest || isLoadingPhase) return;
    setActive(findTabIndex(manifest.tabs,'cover',0));
  });
    function resolveEditionId(){
    var Requested=null;
    try{ Requested=new URLSearchParams(window.location.search).get('to'); }catch(e){}
    return Requested || 'public';
  }
  var EditionId=resolveEditionId();
  // Second param, independent of the tenant ("to"): which tab to land
  // on. Accepts either a tab's objectId or its label (case-insensitive).
  // Falls back to 1 (BOOTCAMP) if the param is absent, unmatched,
  // or the manifest doesn't have that many tabs.
  function resolveInitialTabIndex(m){
    var Requested=null;
    try{ Requested=new URLSearchParams(window.location.search).get('tab'); }catch(e){}
    var DefaultLandingIndex=findTabIndex((m && m.tabs) || [], 2, 1);
    return findTabIndex((m && m.tabs) || [], Requested, DefaultLandingIndex);
  }
  
  function loadManifest(FileName, IsFallbackAttempt){
    fetch(FileName).then(r=>{
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    }).then(m=>{
      manifest=m;
      activeIndex=resolveInitialTabIndex(m);
      prevIndex=activeIndex;
      applyManifestRuntimeSettings();
      buildTabEls();
      paintLoading({instant:true});
      beginPreload();
    }).catch(err=>{
      if(!IsFallbackAttempt && EditionId!=='public'){
        // Unknown or missing edition — fall back to the public manifest
        // rather than failing outright.
        console.warn(
          '[KW] Could not load manifest for edition "' + EditionId +
          '" — falling back to public. Reason:', err.message
        );
        loadManifest('to-public.json', true);
        return;
      }
      shell.innerHTML=`<div style="padding:24px;font-family:system-ui,sans-serif;color:#a33;">
        <strong>Failed to load the tab stack.</strong><br>${(err&&err.message)||err}
      </div>`;
    });
  }
  loadManifest('to-'+EditionId+'.json', false);
  window.addEventListener('error',(e)=>{
    if(shell.querySelector('.tab')) return;
    shell.innerHTML=`<div style="padding:24px;font-family:system-ui,sans-serif;color:#a33;">
      <strong>Script error:</strong><br>${e.message} (${e.filename}:${e.lineno})
    </div>`;
  });
  function queuePaint(){
    if(!manifest) return;
    requestAnimationFrame(()=>{
      if(isLoadingPhase) paintLoading(); else paint();
    });
  }
  window.addEventListener('resize',queuePaint);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',queuePaint);
    window.visualViewport.addEventListener('scroll',queuePaint);
  }

  // Public surface for subpages to call via window.parent, see
  // scripts/tab-anchor-links.js.
  window.DocumentationTabController = {
    scrollActiveFrameTo: scrollActiveFrameTo,
    switchToTab: switchToTab
  };
})();
</script>
